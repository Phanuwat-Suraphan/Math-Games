name: ตรวจสอบโค้ด

# รันทุกครั้งที่มีการ push เพื่อจับ error ตั้งแต่เนิ่น ๆ
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: คอมไพล์และทดสอบ
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ใช้ npm install ไม่ใช่ npm ci เพราะโปรเจกต์ยังไม่มี package-lock.json
      - name: ติดตั้ง dependency
        run: npm install

      # ตรวจการนำเข้าชื่อข้ามไฟล์ ไม่ต้องใช้ dependency จึงรันได้ทันที
      - name: ตรวจการนำเข้าชื่อข้ามไฟล์
        run: node tests/imports.test.mjs

      # ตรวจว่าคลาส CSS ที่หน้าจอใช้มีนิยามอยู่จริง
      # คลาสที่หายไปไม่ทำให้ build พัง จึงไม่มีทางถูกจับได้จากขั้นอื่นเลย
      - name: ตรวจระบบดีไซน์
        run: node tests/styles.test.mjs

      # ขั้นนี้สำคัญที่สุด เป็นการตรวจไฟล์ React ที่ตรวจในเครื่องพัฒนาไม่ได้
      - name: ตรวจ TypeScript ทั้งโปรเจกต์
        run: npm run typecheck

      - name: build เว็บจริง
        run: npm run build

      - name: คอมไพล์ตรรกะเกมสำหรับชุดทดสอบ
        run: npx tsc -p tsconfig.tests.json --outDir /tmp/logic

      - name: ทดสอบระบบความก้าวหน้า (Part 1–3)
        run: node tests/progression.test.mjs /tmp/logic

      - name: ทดสอบ Question Engine (Part 4)
        run: node tests/questionEngine.test.mjs /tmp/logic

      - name: ทดสอบการต่อด่านเข้ากับ Question Engine
        run: node tests/stageQuestions.test.mjs /tmp/logic

      - name: ทดสอบระบบต่อสู้ (Part 5)
        run: node tests/battle.test.mjs /tmp/logic

      - name: ทดสอบปริศนาคณิตศาสตร์
        run: node tests/puzzles.test.mjs /tmp/logic

      - name: ทดสอบมินิเกม (จับคู่ โยงเส้น ลากวาง รับของ)
        run: node tests/minigames.test.mjs /tmp/logic

      - name: ทดสอบร้านค้าและของสวมใส่ (Part 6)
        run: node tests/inventory.test.mjs /tmp/logic

      - name: ทดสอบเนื้อเรื่อง (Part 7)
        run: node tests/story.test.mjs /tmp/logic

      - name: ทดสอบโหมดโร้คไลค์ (หอคอยไม่รู้จบ)
        run: node tests/roguelike.test.mjs /tmp/logic

      - name: ทดสอบโหมดเอาชีวิตรอด (สนามรบตัวเลข)
        run: node tests/survivor.test.mjs /tmp/logic

      - name: ทดสอบ Safe Zone Guardians (เขาวงกตสามมิติและภารกิจ ป.4)
        run: node tests/safezone.test.mjs /tmp/logic

      - name: ทดสอบโดมสีเขียว (ฟาร์ม สมุดบัญชี รหัสฟาร์ม และสมดุลเกม)
        run: node tests/farm.test.mjs /tmp/logic

      - name: ทดสอบแผงคุณครู (ตัวชี้วัด รหัสผลการเรียน และสรุปทั้งห้อง)
        run: node tests/teacher.test.mjs /tmp/logic

      - name: ทดสอบภาพประกอบ
        run: node tests/art.test.mjs /tmp/logic

      - name: ทดสอบสมุดสถิติและถ้วยรางวัล
        run: node tests/records.test.mjs /tmp/logic

      - name: ทดสอบเครื่องแต่งเพลง
        run: node tests/music.test.mjs /tmp/logic

      - name: คอมไพล์เครื่องยนต์เกมการ์ด
        run: npx tsc -p tsconfig.duel.json --outDir /tmp/duel

      - name: ทดสอบเกมการ์ด Divisor Duel
        run: node src/divisorDuel/web/test.mjs /tmp/duel
