<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Adventure Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Mitr:wght@400;500;600&display=swap">
<style>
  /* โลกเดียวสว่างสดใส (ตั้งใจไม่ทำโหมดมืด เพราะเป็นเกมเด็กที่มีสีประจำการ์ด) */
  :root{
    color-scheme: light;
    --sky:#E4F3FF; --sky-2:#CFE8FB; --paper:#FFFFFF; --ink:#23324A; --ink-2:#51607A; --line:#D3E0EE;
    --time:#1E88D9; --find:#8B4FC7; --daily:#3E9E4F; --chal:#E8572E; --gold:#D99A00; --gold-l:#FFE27A;
    --good:#2E9E5B; --bad:#E0533D;
    --cute:"Mali","Leelawadee UI","Tahoma",sans-serif;
    --display:"Mitr","Kanit","Leelawadee UI","Tahoma",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100%; color:var(--ink); font-family:var(--cute); font-size:16px; line-height:1.5;
    background-color:var(--sky);
    background-image:radial-gradient(rgba(255,255,255,.85) 2px, transparent 2.5px);
    background-size:28px 28px;
    padding-inline:16px; padding-block:0 40px;
  }
  button{font-family:inherit; color:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid #FFB300; outline-offset:2px}
  .app{max-width:1180px; margin:0 auto}

  /* ── หัวเกม ── */
  .top{display:flex; align-items:center; gap:10px; padding-block:12px; flex-wrap:wrap}
  .logo{font:600 22px/1 var(--display); letter-spacing:.02em; margin-right:auto; display:flex; align-items:center; gap:8px}
  .logo small{font:500 14px var(--cute); color:var(--ink-2)}
  .icon-btn{
    border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:6px 12px;
    font:600 14px var(--cute); display:inline-flex; align-items:center; gap:6px; box-shadow:0 3px 0 var(--line);
  }
  .icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}

  /* ── ปุ่มหลัก ── */
  .btn{
    --b:#1E88D9; border:0; border-radius:18px; padding:12px 20px; min-height:52px;
    font:700 18px/1.2 var(--cute); color:#fff; background:var(--b);
    box-shadow:0 5px 0 color-mix(in srgb, var(--b) 70%, #000); transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--b) 70%, #000)}
  .btn[disabled]{opacity:.45; cursor:not-allowed}
  .btn.ghost{background:#fff; color:var(--ink); box-shadow:0 5px 0 var(--line); border:2px solid var(--line)}
  .btn.big{font-size:21px; padding:14px 26px; min-height:60px}

  /* ── หน้าเริ่ม ── */
  .setup{max-width:760px; margin:10px auto 0; background:var(--paper); border-radius:28px; padding:24px 22px 26px; box-shadow:0 10px 30px rgba(35,50,74,.12)}
  .hero-row{display:flex; justify-content:center; gap:4px; margin:-6px 0 4px; flex-wrap:wrap}
  .hero-row svg{width:74px; height:auto}
  .setup h1{font:600 clamp(26px,5vw,36px)/1.1 var(--display); text-align:center; margin:4px 0 2px; text-wrap:balance}
  .setup .tag{text-align:center; color:var(--ink-2); margin:0 0 18px}
  .setup h2{font:700 17px var(--cute); margin:18px 0 8px}
  .seg{display:flex; gap:8px; flex-wrap:wrap}
  .seg button{
    border:3px solid var(--line); background:#fff; border-radius:16px; padding:8px 16px; font:700 17px var(--cute); min-width:64px;
  }
  .seg button[aria-pressed="true"]{border-color:var(--time); background:#E6F3FC; color:#0F5B98}
  .slots{display:grid; gap:10px}
  .slot{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:center; border:2px solid var(--line); border-radius:18px; padding:10px 12px}
  .slot .who{font:700 15px var(--cute); color:var(--ink-2)}
  .slot input{
    font:600 16px var(--cute); border:2px solid var(--line); border-radius:12px; padding:6px 10px; width:100%; min-width:0; color:var(--ink);
  }
  .hero-pick{grid-column:1 / -1; display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .hero-pick button{
    border:3px solid var(--line); background:#fff; border-radius:16px; padding:4px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:0;
    font:600 12.5px/1.2 var(--cute);
  }
  .hero-pick button svg{width:46px; height:auto}
  .hero-pick button[aria-pressed="true"]{border-color:var(--hc); background:color-mix(in srgb, var(--hc) 12%, #fff)}
  .start-row{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap}

  /* ── หน้าเกม ── */
  .layout{display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:18px; align-items:start}
  @media (max-width:880px){ .layout{grid-template-columns:1fr} }
  .board-wrap{background:var(--paper); border-radius:24px; padding:8px; box-shadow:0 8px 24px rgba(35,50,74,.10)}
  .board-wrap > svg{display:block; width:100%; height:auto; max-height:calc(100vh - 110px); margin:0 auto}
  .pawn{transition:transform .32s cubic-bezier(.3,1.4,.6,1)}
  .pawn.now .bob{animation:bob 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-1.6px)}}
  .panel{display:flex; flex-direction:column; gap:12px}
  .turn{background:var(--paper); border-radius:24px; padding:16px; box-shadow:0 8px 24px rgba(35,50,74,.10); display:flex; flex-direction:column; gap:12px}
  .turn-head{display:flex; align-items:center; gap:12px}
  .turn-head svg{width:62px; height:auto; flex:none}
  .turn-head b{display:block; font:700 20px/1.2 var(--cute)}
  .turn-head span{color:var(--ink-2); font-size:14.5px}
  .deck-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .players{display:grid; gap:8px}
  .pl{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; background:var(--paper); border-radius:18px; padding:8px 12px; border:3px solid transparent}
  .pl.now{border-color:var(--hc); box-shadow:0 0 0 4px color-mix(in srgb, var(--hc) 18%, transparent)}
  .pl svg{width:44px; height:auto}
  .pl .nm{font:700 16px/1.2 var(--cute)}
  .pl .sub{font-size:13px; color:var(--ink-2)}
  .pl .coins{font:600 18px var(--display); display:flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums}
  .hand{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px}
  .chip{font:600 12px/1 var(--cute); background:#FFF5D1; border:1.5px solid #F0CF6A; border-radius:99px; padding:3px 8px}
  .note{font-size:13.5px; color:var(--ink-2); text-align:center; margin:0}

  /* ── การ์ดบนจอ ── */
  .overlay{position:fixed; inset:0; z-index:20; background:rgba(22,38,64,.5); display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:max(16px, env(safe-area-inset-top,0px)) 16px 24px}
  .gcard{
    --c:#1E88D9; --bg:#E6F3FC;
    width:min(460px,100%); margin:auto 0; border-radius:26px; background:var(--bg); border:5px solid var(--c); overflow:hidden;
    background-image:radial-gradient(rgba(255,255,255,.95) 2px, transparent 2.4px); background-size:24px 24px;
    box-shadow:0 18px 50px rgba(0,0,0,.25);
  }
  .gcard.pop{animation:pop .28s cubic-bezier(.3,1.5,.6,1)}
  @keyframes pop{from{transform:scale(.85) rotate(-2deg); opacity:0}}
  .t-time{--c:#1E88D9; --bg:#E6F3FC} .t-find{--c:#8B4FC7; --bg:#F2E9FB} .t-daily{--c:#3E9E4F; --bg:#E7F5E9}
  .t-chal{--c:#E8572E; --bg:#FDEBE4} .t-special{--c:#D99A00; --bg:#FFF5D1} .t-plain{--c:#23324A; --bg:#F4F7FB}
  .g-head{position:relative; background:var(--c); color:#fff; display:flex; justify-content:space-between; align-items:center; padding:9px 16px 10px; font:500 17px var(--display); margin-bottom:10px}
  .g-head::after{content:""; position:absolute; left:0; right:0; bottom:-9px; height:10px; background:radial-gradient(circle at 50% 0, var(--c) 9px, transparent 9.6px) 0 0 / 20px 10px repeat-x}
  .g-head .stars{color:#FFE27A; letter-spacing:.05em}
  .g-body{padding:6px 18px 18px; display:flex; flex-direction:column; gap:12px}
  .buddy{display:flex; align-items:center; gap:8px}
  .bd-ic{width:46px; height:46px; border-radius:50%; background:#fff; border:2.5px solid var(--c); display:flex; align-items:flex-end; justify-content:center; overflow:hidden; flex:none}
  .bd-ic svg{width:40px; height:auto; display:block}
  .bd-tx{position:relative; background:#fff; border-radius:14px; padding:6px 12px; font:700 15px/1.25 var(--cute)}
  .bd-tx::before{content:""; position:absolute; left:-7px; top:50%; margin-top:-6px; border-style:solid; border-width:6px 8px 6px 0; border-color:transparent #fff transparent transparent}
  .art{display:flex; flex-direction:column; align-items:center; gap:8px}
  .art .clk{width:min(190px,56vw) !important; height:auto !important}
  .tag{font:600 14px var(--display); color:var(--c)}
  .word{font:600 20px/1.3 var(--display); background:#fff; border-radius:14px; padding:6px 16px; text-align:center}
  .blank{font:600 30px var(--display); letter-spacing:.12em; color:#9AA6B8}
  .trio{display:flex; gap:8px; justify-content:center}
  .trio figure{margin:0; display:flex; flex-direction:column; align-items:center}
  .trio .clk{width:min(104px,26vw) !important; height:auto !important}
  .trio figcaption{font:600 17px var(--display); color:var(--c)}
  .q{font:700 21px/1.35 var(--cute); text-align:center; text-wrap:balance; margin:0}
  .q em{font-style:normal; color:var(--c); text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:4px}
  .opts{display:grid; gap:10px}
  .opt{
    border:3px solid var(--c); background:#fff; border-radius:18px; min-height:56px; padding:8px 14px;
    font:700 19px/1.25 var(--cute); text-align:left; display:flex; align-items:center; gap:10px;
    box-shadow:0 4px 0 color-mix(in srgb, var(--c) 35%, #fff);
  }
  .opt:active{transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 35%, #fff)}
  .opt .k{font:600 15px var(--display); background:var(--c); color:#fff; border-radius:10px; min-width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; flex:none}
  .opt .e{font-size:24px; line-height:1}
  .opt .tm{margin-left:auto; font:600 17px var(--display); color:var(--c); font-variant-numeric:tabular-nums; white-space:nowrap}
  .opt.gone{opacity:.25; pointer-events:none; text-decoration:line-through}
  .opt.right{background:#E3F7EA; border-color:var(--good)}
  .opt.wrong{background:#FDE7E3; border-color:var(--bad)}
  .opt .n{margin-left:auto; width:34px; height:34px; border-radius:50%; background:var(--c); color:#fff; font:600 18px var(--display); display:inline-flex; align-items:center; justify-content:center}
  .opt .n:empty{background:#fff; border:2.5px dashed color-mix(in srgb, var(--c) 45%, #fff)}
  .setter{display:flex; flex-direction:column; align-items:center; gap:10px}
  .setter .clk{width:min(230px,66vw) !important; height:auto !important; touch-action:none; cursor:grab}
  .set-ctl{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%}
  .set-ctl div{display:flex; flex-direction:column; align-items:center; gap:4px; background:#fff; border-radius:16px; padding:8px}
  .set-ctl span{font:700 14px var(--cute)}
  .set-ctl span i{font-style:normal; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px}
  .set-ctl .pair{display:flex; gap:8px; flex-direction:row}
  .set-ctl button{width:56px; height:46px; border-radius:14px; border:3px solid var(--line); background:#fff; font:700 20px var(--display)}
  .row-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .powers{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .power{border:2px solid #F0CF6A; background:#FFF5D1; border-radius:99px; padding:6px 12px; font:700 14px var(--cute)}
  .power[aria-pressed="true"]{background:#FFD233; border-color:#B98400}
  .fb{border-radius:18px; padding:12px 14px; display:flex; gap:12px; align-items:center; background:#fff}
  .fb svg{width:64px; height:auto; flex:none}
  .fb b{display:block; font:700 20px/1.2 var(--cute)}
  .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
  .fb p{margin:2px 0 0; font-size:15.5px; line-height:1.4}
  .g-foot{font:500 12px var(--display); color:color-mix(in srgb, var(--c) 70%, #000); text-align:right; padding:0 16px 10px}
  .sp-burst{position:relative; isolation:isolate; width:150px; height:150px; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:72px; line-height:1}
  .sp-burst::before{content:""; position:absolute; inset:0; z-index:-1; border-radius:50%; background:repeating-conic-gradient(#FFE27A 0 11deg,#FFF8DC 11deg 22deg); -webkit-mask:radial-gradient(circle,#000 45%,transparent 71%); mask:radial-gradient(circle,#000 45%,transparent 71%); animation:spin 14s linear infinite}
  .sp-burst svg{width:104px; height:auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sp-name{font:600 24px/1.1 var(--display); color:#7A5700; text-align:center; background:#fff; border-radius:99px; padding:6px 18px; align-self:center; box-shadow:0 0 0 3px #F0CF6A}
  .win{text-align:center}
  .win .crown{font-size:44px; line-height:1}
  .win svg.hero{width:140px; height:auto}
  .rank{display:grid; gap:8px; text-align:left}
  .rank div{display:grid; grid-template-columns:30px 40px 1fr auto; gap:10px; align-items:center; background:#fff; border-radius:16px; padding:6px 12px; font:700 16px var(--cute)}
  .rank svg{width:40px; height:auto}
  .rules-list{margin:0; padding-left:22px; font-size:16px; line-height:1.55}
  .rules-list li{margin-bottom:6px}
  .confetti{position:fixed; top:-12px; width:10px; height:14px; border-radius:3px; z-index:40; pointer-events:none; animation:fall 1.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg); opacity:.9}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>

<div class="app" id="app"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function(){
  const INK = '#23324A', HOUR = '#E53935', MIN = '#1E6FD9';
  function clock(h, m, o){
    o = o || {};
    const size = o.size || 30, hands = o.hands !== false, plain = !!o.plain;
    const vb = plain ? '-50 -50 100 100' : '-55 -60 110 118';
    const hgt = plain ? size : size * 118 / 110;
    let s = '<svg class="clk" viewBox="'+vb+'" style="width:'+size+'mm;height:'+hgt.toFixed(2)+'mm" role="img" aria-label="'+(hands ? ('นาฬิกา '+h+':'+String(m).padStart(2,'0')) : 'หน้าปัดนาฬิกาเปล่า')+'">';
    if (!plain){
      // กระดิ่งปลุก ขา และปุ่มด้านบน — อยู่นอกหน้าปัด ไม่บังตัวเลข
      s += '<line x1="-29" y1="41" x2="-37" y2="54" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/>';
      s += '<line x1="29" y1="41" x2="37" y2="54" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/>';
      s += '<rect x="-5" y="-57" width="10" height="9" rx="2.5" fill="'+INK+'"/>';
      [-1, 1].forEach(d => {
        s += '<g transform="rotate('+(d*38)+')"><path d="M-15 -47 Q-15 -62 0 -62 Q15 -62 15 -47 Z" style="fill:var(--c,#1E88D9)" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-63.5" r="3" fill="'+INK+'"/></g>';
      });
    }
    s += '<circle r="47" fill="#FFFDF6" style="stroke:'+(plain ? INK : 'var(--c,#23324A)')+'" stroke-width="'+(plain ? 3.6 : 5)+'"/>';
    if (!plain) s += '<circle r="49.6" fill="none" stroke="'+INK+'" stroke-width="1.4"/>';
    for (let i = 0; i < 60; i++){
      const major = i % 5 === 0;
      s += '<line x1="0" y1="-43.5" x2="0" y2="'+(major ? -38.5 : -41.2)+'" stroke="'+(major ? INK : '#9AA6B8')+'" stroke-width="'+(major ? 2 : 1)+'" transform="rotate('+(i*6)+')"/>';
    }
    for (let n = 1; n <= 12; n++){
      const a = n * Math.PI / 6, r = 30.5;
      s += '<text x="'+(r*Math.sin(a)).toFixed(2)+'" y="'+(-r*Math.cos(a)).toFixed(2)+'" text-anchor="middle" dominant-baseline="central" font-family="Mitr,Kanit,Tahoma,sans-serif" font-weight="600" font-size="12" fill="'+INK+'">'+n+'</text>';
    }
    if (hands){
      const ha = (h % 12) * 30 + m * 0.5, ma = m * 6;
      s += '<line x1="0" y1="4" x2="0" y2="-20" stroke="'+HOUR+'" stroke-width="6.4" stroke-linecap="round" transform="rotate('+ha+')"/>';
      s += '<line x1="0" y1="6" x2="0" y2="-35" stroke="'+MIN+'" stroke-width="3.4" stroke-linecap="round" transform="rotate('+ma+')"/>';
    }
    s += '<circle r="3.6" fill="'+INK+'"/></svg>';
    return s;
  }

  /* ───────── ตัวละคร (วาดเอง ไม่ต้องใช้รูปภายนอก) ───────── */
  const SKIN = '#FFD9B8', HAIR = '#3A2A20', BLUSH = '#FF9DB0';
  // ฮีโร่ 4 ตัว: อัศวินทิม (ฮีโร่ชาย) · นางฟ้าใบเตย (ฮีโร่หญิง) · พ่อมดโมโม่ · มังกรน้อยฟูฟู
  const NAMES = {knight:'อัศวินทิม', fairy:'นางฟ้าใบเตย', wizard:'พ่อมดโมโม่', dragon:'มังกรน้อยฟูฟู'};
  const O = 'stroke="'+INK+'" stroke-linejoin="round"';
  function face(cx, cy, opt){
    opt = opt || {};
    let s = '';
    s += '<ellipse cx="'+(cx-4.4)+'" cy="'+cy+'" rx="1.9" ry="2.3" fill="'+INK+'"/><ellipse cx="'+(cx+4.4)+'" cy="'+cy+'" rx="1.9" ry="2.3" fill="'+INK+'"/>';
    s += '<circle cx="'+(cx-3.8)+'" cy="'+(cy-.8)+'" r=".7" fill="#fff"/><circle cx="'+(cx+5)+'" cy="'+(cy-.8)+'" r=".7" fill="#fff"/>';
    s += '<ellipse cx="'+(cx-7.2)+'" cy="'+(cy+4)+'" rx="2.2" ry="1.25" fill="'+BLUSH+'" opacity=".85"/><ellipse cx="'+(cx+7.2)+'" cy="'+(cy+4)+'" rx="2.2" ry="1.25" fill="'+BLUSH+'" opacity=".85"/>';
    s += '<path d="M'+(cx-2.6)+' '+(cy+4.2)+' Q'+cx+' '+(cy+7)+' '+(cx+2.6)+' '+(cy+4.2)+'" fill="none" stroke="'+INK+'" stroke-width="1.1" stroke-linecap="round"/>';
    if (opt.fang) s += '<path d="M'+(cx+.6)+' '+(cy+5.3)+' l.9 1.6 .9-1.4" fill="#fff" stroke="'+INK+'" stroke-width=".5"/>';
    return s;
  }
  function charInner(k){
    let s = '';
    if (k === 'knight'){
      s += '<path d="M12 27 L6 46 Q20 42.5 34 46 L28 27 Z" fill="#E53935" '+O+' stroke-width="1.2"/>';
      s += '<rect x="14" y="40" width="5" height="6.5" rx="2" fill="#AEB9C7" '+O+' stroke-width=".8"/><rect x="21" y="40" width="5" height="6.5" rx="2" fill="#AEB9C7" '+O+' stroke-width=".8"/>';
      s += '<path d="M12.6 29.5 L9.5 36" stroke="#AEB9C7" stroke-width="3.8" stroke-linecap="round"/><circle cx="9.2" cy="36.8" r="2.1" fill="#AEB9C7" '+O+' stroke-width=".8"/>';
      s += '<path d="M35.5 21.5 L38.2 4.5" stroke="#DDE4EC" stroke-width="2.4" stroke-linecap="round"/><path d="M35.5 21.5 L38.2 4.5" stroke="'+INK+'" stroke-width=".6"/><path d="M32.2 21.2 L38.8 22.2" stroke="#E0A100" stroke-width="2" stroke-linecap="round"/>';
      s += '<path d="M27.4 29.5 L34.2 23.5" stroke="#AEB9C7" stroke-width="3.8" stroke-linecap="round"/><circle cx="34.8" cy="22.6" r="2.2" fill="#AEB9C7" '+O+' stroke-width=".8"/>';
      s += '<rect x="12" y="26" width="16" height="15.5" rx="5" fill="#1E88D9" '+O+' stroke-width="1.3"/><path d="M12.4 33.5 H27.6" stroke="#E0A100" stroke-width="2.2"/>';

  /* ───────── หมุนเข็มด้วยการลาก ───────── */
  function bindSetter(){
    const box = document.getElementById('setClock'); if (!box || !M || M.done) return;
    const svg = box.querySelector('svg');
    let drag = false;
    const setFrom = ev => {
      const r = svg.getBoundingClientRect();
      // หน้าปัดอยู่ที่ (0,0) ใน viewBox -55 -60 110 118
      const cx = r.left + r.width * 55 / 110, cy = r.top + r.height * 60 / 118;
      let a = Math.atan2(ev.clientX - cx, -(ev.clientY - cy)) * 180 / Math.PI; if (a < 0) a += 360;
      const m = (Math.round(a / 30) * 5) % 60;
      if (m !== M.set[1]){ M.set[1] = m; redrawSetter(); SND.step(); }
    };
    svg.addEventListener('pointerdown', ev => { drag = true; try{ svg.setPointerCapture(ev.pointerId); }catch(e){} setFrom(ev); });
    svg.addEventListener('pointermove', ev => { if (drag) setFrom(ev); });
    svg.addEventListener('pointerup', () => drag = false);
    svg.addEventListener('pointercancel', () => drag = false);
  }
  function redrawSetter(){
    const box = document.getElementById('setClock'); if (!box) return;
    box.innerHTML = clock(M.set[0], M.set[1]);
    bindSetter();
  }

      p.coins += M.boost ? 2 : 1;
      say('ถูกต้อง! '+c.a);

      SND.bad();
      M.shieldOffer = p.hand.includes('shield') && !S.used && !M.retry;
      say('ยังไม่ถูก คำตอบคือ '+c.a);
    }
    save(); render();
  }

    S.used = true;
  }
  async function next(){
    const c = BY_ID[M.id], p = cur(), i = S.turn, ok = M.ok, gate = M.gate;
    const steps = ok ? c.s + (M.fast ? 2 : 0) : 0;
    M = null; render();
    if (ok && gate){
      p.pos = CASTLE; S.winner = i; save(); render(); SND.win(); confetti(60);
      M = {type:'win'}; renderModal(); return;
    }
    const start = p.pos;
    if (steps) await walk(i, Math.min(GATE, p.pos + steps));
    if (p.pos !== start && STAR_SQ.includes(p.pos) && S.sdeck.length){
      M = {type:'special', key:S.sdeck.shift()};
      if (M.key === 'chest'){ p.coins += 2; S.sdeck.push('chest'); }
      SND.good(); save(); render(); return;
    }
    endTurn();
  }
  function walk(i, to){
    return new Promise(res => {
      busy = true;
      const p = S.players[i];
      const stepOnce = () => {
        if (p.pos >= to){ busy = false; save(); res(); return; }
        p.pos++; placePawn(i); SND.step();
        setTimeout(stepOnce, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 60 : 360);
      };
      stepOnce();
    });
  }
  function endTurn(){
    S.turn = (S.turn + 1) % S.players.length;
    if (S.turn === 0) S.round++;
    S.used = false; M = null; save(); render();
    say('ตาของ '+cur().name);
  }
  function confetti(n){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cols = ['#1E88D9','#8B4FC7','#3E9E4F','#E8572E','#FFD233','#FF8FC0'];
    for (let k = 0; k < (n || 26); k++){
      const d = document.createElement('div'); d.className = 'confetti';
      d.style.left = Math.random() * 100 + 'vw'; d.style.background = pick(cols);
      d.style.animationDelay = Math.random() * .3 + 's'; d.style.animationDuration = 1 + Math.random() * .8 + 's';
      document.body.appendChild(d); setTimeout(() => d.remove(), 2400);
    }
  }

  /* ───────── ปุ่มทั้งหมด ───────── */
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id && t.id.startsWith('name')) setup.names[+t.dataset.i] = t.value;
  });
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled || busy) return;
    const act = b.dataset.act, v = b.dataset.v;
    const p = S.players ? cur() : null;
    switch (act){
      case 'sound': S.sound = !S.sound; if (S.screen === 'game') save(); render(); if (S.sound) SND.card(); break;
      case 'rules': M = {type:'rules'}; renderModal(); break;
      case 'close': M = null; renderModal(); break;
      case 'end': M = {type:'endask'}; renderModal(); break;
      case 'endnow': M = {type:'win'}; SND.win(); renderModal(); break;
      case 'showwin': M = {type:'win'}; renderModal(); break;
      case 'again': M = null; clearSaved(); S = {screen:'setup', sound:S.sound}; render(); break;
      case 'n': setup.n = +v; render(); break;
      case 'easy': setup.easy = v === '1'; render(); break;
      case 'hero': {
        const i = +b.dataset.i, j = setup.heroes.indexOf(v);
        if (j !== i){ setup.heroes[j] = setup.heroes[i]; setup.heroes[i] = v; }
        render(); break;
      }
      case 'start': newGame(); say('เริ่มเกม ตาของ '+cur().name); break;
      case 'resume': { const s = loadSaved(); if (s){ S = s; M = null; render(); } break; }
      case 'draw': openCard(draw(v), {gate:p.pos === GATE}); break;
      case 'travel':
        useSpecial('travel'); save(); render();
        await walk(S.turn, Math.min(GATE, p.pos + 1)); render(); break;
      case 'pick': {
        const c = BY_ID[M.id], i = +v;
        if (i === c.ans) resolve(true);
        else { M.wrong.push(i); resolve(false); }
        break;
      }
      case 'ord': {
        const i = +v, n = M.picked.indexOf(i);
        if (n >= 0) M.picked.splice(n); else M.picked.push(i);
        SND.step(); renderModal(); break;
      }
      case 'ordreset': M.picked = []; renderModal(); break;
      case 'ordcheck': { const c = BY_ID[M.id]; resolve(M.picked.every((x, n) => x === c.order[n])); break; }
      case 'h': M.set[0] = ((M.set[0] + +v + 11) % 12) + 1; redrawSetter(); SND.step(); break;
      case 'm': {
        let m = M.set[1] + +v, h = M.set[0];
        if (m >= 60){ m -= 60; h = h % 12 + 1; }
        if (m < 0){ m += 60; h = ((h + 10) % 12) + 1; }
        M.set = [h, m]; redrawSetter(); SND.step(); break;
      }
      case 'setcheck': { const c = BY_ID[M.id]; resolve(M.set[0] % 12 === c.target[0] % 12 && M.set[1] === c.target[1]); break; }
      case 'power': {
        if (v === 'lucky'){
          useSpecial('lucky'); save();
          const c = BY_ID[M.id]; openCard(draw(c.t), {gate:M.gate}); render(); break;
        }
        if (v === 'bunny'){
          useSpecial('bunny'); save();
          const c = BY_ID[M.id];
          M.gone.push(pick(M.order.filter(i => i !== c.ans)));
          render(); break;
        }
        // boost / fast: กดอีกครั้งเพื่อยกเลิก ก่อนตอบ
        if (M[v]){ M[v] = false; p.hand.push(v); S.sdeck.splice(S.sdeck.lastIndexOf(v), 1); S.used = false; }
        else { M[v] = true; useSpecial(v); }
        save(); render(); break;
      }
      case 'shield': {
        useSpecial('shield');
        const c = BY_ID[M.id];
        Object.assign(M, {done:false, ok:null, shieldOffer:false, retry:true, picked:[], set:c.start ? c.start.slice() : null, cheer:null, comfort:null});
        save(); render(); break;
      }
      case 'next': next(); break;
      case 'spkeep': p.hand.push(M.key); endTurn(); break;
      case 'spdone': endTurn(); break;
      case 'drop': {
        const all = p.hand.concat([M.key]), i = +v;
        S.sdeck.push(all[i]); all.splice(i, 1); p.hand = all; endTurn(); break;
      }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && M && (M.type === 'rules' || M.type === 'endask')){ M = null; renderModal(); }
  });

  /* ───────── เริ่ม (เก็บสถานะไว้เมื่อหน้าเว็บอัปเดต) ───────── */
  try{ if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({S, setup})); }catch(e){}
  function start(d){
    if (d && d.S) S = d.S;
    if (d && d.setup) setup = d.setup;
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
